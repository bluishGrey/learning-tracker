# main 에 push 될 때마다 빌드해서 GitHub Pages 에 배포한다.
#
# ─ 왜 이 구성인가 ─────────────────────────────────────────
#
# Pages 의 '소스'를 브랜치(gh-pages)가 아니라 **Actions** 로 둔다. 빌드 결과물을
# 저장소에 커밋하지 않아도 되므로 dist/ 를 .gitignore 에 둔 상태를 유지할 수 있다.
# 커밋된 산출물은 소스와 어긋나는 순간을 알 수 없어서, 그 경로는 피한다.
#
# 주소는 https://bluishgrey.github.io/learning-tracker/ 처럼 **저장소 하위 경로**가
# 된다. vite.config.js 의 base: './' 와 HashRouter 조합이 이 경로를 이미 감당하므로
# 여기서 base 를 따로 주지 않는다 (상대 경로라 어느 하위 경로에 올라가도 자산을 찾고,
# 해시 라우팅이라 새로고침에 서버 리라이트가 필요 없다).

name: Pages 배포

on:
  push:
    branches: [main]
  # 코드 변경 없이 다시 배포하고 싶을 때 (Actions 탭에서 직접 실행)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # deploy-pages 가 OIDC 로 배포 권한을 증명한다

# 배포는 겹치면 안 된다. 다만 진행 중인 것을 **취소하지는 않는다** —
# 반쯤 올라간 상태로 끊기는 것보다 순서대로 끝내는 편이 안전하다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 로컬 개발 버전과 맞춘다
          cache: npm

      # npm install 이 아니라 ci — package-lock.json 을 그대로 재현한다.
      # 배포본이 어제와 다른 의존성으로 빌드되는 일을 막는다.
      - run: npm ci

      - run: npm run build

      # Jekyll 처리를 끈다. Actions 소스에서는 애초에 돌지 않지만,
      # 이 프로젝트의 청크 이름에 _basePickBy-*.js 처럼 밑줄로 시작하는 것이 있어
      # (Jekyll 은 _ 로 시작하는 경로를 숨긴다) 보험으로 남겨 둔다.
      - run: touch dist/.nojekyll

      # enablement: true — Pages 설정이 아직 없으면 이 단계가 직접 켠다.
      # 없이 두면 첫 실행이 'Get Pages site failed' 로 멈추고, 저장소 설정에서
      # 사람이 한 번 켜 줘야 한다. 이미 켜져 있으면 아무 일도 하지 않는다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
